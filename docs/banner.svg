<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#000" opacity="0.10" />
    </pattern>
  </defs>

  <!-- Window -->
  <rect x="0" y="0" width="1280" height="420" fill="#dcbcff" />
  <rect x="0" y="0" width="1280" height="420" fill="url(#dots)" />
  <rect x="40" y="36" width="1200" height="350" rx="28" fill="#000" transform="translate(12 12)" />
  <rect x="40" y="36" width="1200" height="350" rx="28" fill="#ffc4d6" stroke="#000" stroke-width="6" />
  <path d="M40 64 a28 28 0 0 1 28 -28 h1144 a28 28 0 0 1 28 28 v32 h-1200 z" fill="#d0c4fc" stroke="#000" stroke-width="6" />
  <circle cx="84" cy="66" r="13" fill="#ff7aa8" stroke="#000" stroke-width="4" />
  <circle cx="124" cy="66" r="13" fill="#ffd51f" stroke="#000" stroke-width="4" />
  <circle cx="164" cy="66" r="13" fill="#a8dc8a" stroke="#000" stroke-width="4" />
  <text x="1200" y="76" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="24">vocab.exe</text>

  <!-- Title -->
  <g font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900">
    <text x="100" y="232" font-size="104" fill="#000" transform="translate(8 8)">GERMAN</text>
    <text x="100" y="232" font-size="104" fill="#4cc6e6" stroke="#000" stroke-width="8" paint-order="stroke" stroke-linejoin="round">GERMAN</text>
    <text x="100" y="336" font-size="104" fill="#000" transform="translate(8 8)">VOCAB</text>
    <text x="100" y="336" font-size="104" fill="#ffd51f" stroke="#000" stroke-width="8" paint-order="stroke" stroke-linejoin="round">VOCAB</text>
  </g>

  <!-- Flashcard sticker -->
  <g transform="translate(830 150) rotate(6)">
    <rect x="0" y="0" width="300" height="180" rx="22" fill="#000" transform="translate(10 10)" />
    <rect x="0" y="0" width="300" height="180" rx="22" fill="#fff" stroke="#000" stroke-width="6" />
    <rect x="24" y="22" width="110" height="34" rx="17" fill="#fff" stroke="#000" stroke-width="4" />
    <text x="79" y="46" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="20">German</text>
    <text x="26" y="118" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="44">die Straße</text>
    <text x="26" y="154" font-family="Georgia, serif" font-style="italic" font-size="20">Die Straße ist ruhig.</text>
  </g>

  <!-- Pills -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22">
    <g transform="translate(700 112) rotate(-5)">
      <rect width="176" height="46" rx="23" fill="#000" transform="translate(4 4)" />
      <rect width="176" height="46" rx="23" fill="#a8dc8a" stroke="#000" stroke-width="4" />
      <text x="88" y="31" text-anchor="middle">swipe = known</text>
    </g>
    <g transform="translate(640 330) rotate(3)">
      <rect width="150" height="46" rx="23" fill="#000" transform="translate(4 4)" />
      <rect width="150" height="46" rx="23" fill="#4cc6e6" stroke="#000" stroke-width="4" />
      <text x="75" y="31" text-anchor="middle">offline first</text>
    </g>
  </g>

  <!-- Smiley -->
  <g transform="translate(1150 330) rotate(-10)">
    <circle r="42" fill="#ffd51f" stroke="#000" stroke-width="5" />
    <ellipse cx="-14" cy="-10" rx="5" ry="9" />
    <ellipse cx="14" cy="-10" rx="5" ry="9" />
    <path d="M-24 8 Q0 34 24 8" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
